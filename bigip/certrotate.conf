# /shared/certrotate/certrotate.conf - global settings (sourced by certrotate.sh)

# Where job definitions, staging, archive and state live. /shared survives
# upgrades and is NOT synced between HA peers.
#JOBS_DIR=/shared/certrotate/jobs.d
#STAGING_DIR=/shared/certrotate/staging
#ARCHIVE_DIR=/shared/certrotate/archive
#FAILED_DIR=/shared/certrotate/failed
#STATE_DIR=/shared/certrotate/state

LOG_FILE=/var/log/certrotate.log
LOCK_FILE=/var/run/certrotate.lock
SYSLOG_FACILITY=local0          # local0 -> /var/log/ltm (feeds remote syslog / SIEM)

# Only make changes on the Active unit. Schedule the script on BOTH peers;
# the standby simply exits.
REQUIRE_ACTIVE=yes

# sync-failover device group to push changes to after a successful rotation.
# Leave blank if you sync manually or use auto-sync.
SYNC_GROUP=""
# If the group was NOT "In Sync" before the run, don't push (someone else may
# have uncommitted work on this unit). The run is logged as a warning instead.
SYNC_ONLY_IF_CLEAN=yes

SAVE_CONFIG=yes
